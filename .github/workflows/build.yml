name: Build

# Proves the plugin builds and its tests pass on a machine other than the author's, so a
# reviewer has a result without installing anything or waiting for a local build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test
        run: ./gradlew test --no-daemon --max-workers=1

      - name: Build the plugin jar
        run: ./gradlew buildPluginJar --no-daemon --max-workers=1

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: boss-plugin-blackout
          path: build/libs/boss-plugin-blackout-*.jar
          if-no-files-found: error

      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
